<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>운동 체크리스트</title>
<style>
  :root{
    --bg:#f4f6f8; --card:#ffffff; --text:#1c2733; --sub:#6b7885; --line:#e3e8ed;
    --run:#2f80ed; --push:#f2994a; --swim:#12a8b8; --hang:#8e5be8; --sel:#1c2733;
    --ok:#27ae60;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#12171d; --card:#1c242d; --text:#e8edf2; --sub:#92a0ad; --line:#2b3641;
      --sel:#e8edf2;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
    line-height:1.5}
  .wrap{max-width:820px;margin:0 auto;padding:16px}
  h1{font-size:20px;margin:4px 0 14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
  .card h2{font-size:15px;margin:0 0 12px}
  .monthbar{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:14px}
  .monthbar button{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);
    color:var(--text);font-size:18px;cursor:pointer}
  .monthbar .label{font-size:18px;font-weight:700;min-width:130px;text-align:center}
  .datepick{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
  .datepick input[type=date]{padding:8px 10px;border:1px solid var(--line);border-radius:8px;
    background:var(--bg);color:var(--text);font-size:15px}
  .datepick .today-btn{padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);
    color:var(--text);cursor:pointer;font-size:14px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media (max-width:560px){.grid{grid-template-columns:1fr}}
  .item{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;align-items:center;
    justify-content:space-between;gap:10px;background:var(--bg)}
  .item .name{font-weight:600}
  .item .name small{display:block;color:var(--sub);font-weight:400;font-size:12px}
  .toggle{position:relative;width:54px;height:30px;flex:none}
  .toggle input{opacity:0;width:0;height:0}
  .toggle span{position:absolute;inset:0;background:var(--line);border-radius:30px;transition:.2s;cursor:pointer}
  .toggle span::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;
    background:#fff;transition:.2s}
  .toggle input:checked + span{background:var(--ok)}
  .toggle input:checked + span::after{transform:translateX(24px)}
  .numin{display:flex;align-items:center;gap:6px}
  .numin input{width:84px;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--card);
    color:var(--text);font-size:16px;text-align:right}
  .numin .unit{color:var(--sub);font-size:14px}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  @media (max-width:560px){.stats{grid-template-columns:1fr 1fr}}
  .stat{border-radius:12px;padding:12px;background:var(--bg);border:1px solid var(--line)}
  .stat .k{font-size:12px;color:var(--sub)}
  .stat .v{font-size:22px;font-weight:700;margin-top:2px}
  .stat .v small{font-size:13px;font-weight:500;color:var(--sub)}
  .chartbox svg{width:100%;height:auto;display:block}
  .bar{cursor:pointer}
  .bar:hover{opacity:.8}
  .axis text{fill:var(--sub);font-size:11px}
  .axis line{stroke:var(--line)}
  .dots{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
  .dot{width:26px;height:26px;border-radius:7px;border:1px solid var(--line);background:var(--bg);
    font-size:11px;color:var(--sub);display:flex;align-items:center;justify-content:center;cursor:pointer}
  .dot.on{color:#fff;border-color:transparent}
  .dot.sel{outline:2px solid var(--sel);outline-offset:1px}
  .daysrow{margin-bottom:16px}
  .daysrow:last-child{margin-bottom:0}
  .daysrow .head{display:flex;justify-content:space-between;align-items:baseline}
  .progress{height:8px;background:var(--line);border-radius:8px;overflow:hidden;margin-top:6px}
  .progress div{height:100%;border-radius:8px;transition:width .3s}
  .tools{display:flex;gap:8px;flex-wrap:wrap}
  .tools button{padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);
    color:var(--text);cursor:pointer;font-size:13px}
  .note{color:var(--sub);font-size:12px;margin-top:8px}
  .tablewrap{overflow-x:auto}
  table.rec{width:100%;border-collapse:collapse;font-size:14px}
  table.rec th,table.rec td{padding:8px 6px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
  table.rec th{color:var(--sub);font-weight:600;font-size:12px}
  table.rec td:first-child,table.rec th:first-child{text-align:left}
  table.rec tbody tr{cursor:pointer}
  table.rec tbody tr:hover{background:var(--bg)}
  table.rec tbody tr.sel{background:var(--bg);font-weight:700}
  .chk{color:var(--ok);font-weight:700}
  .empty{color:var(--sub);text-align:center;padding:18px 0;font-size:14px}
</style>
</head>
<body>
<div class="wrap">
  <h1>🏃 운동 체크리스트</h1>

  <div class="monthbar">
    <button id="prev" aria-label="이전 달">‹</button>
    <div class="label" id="monthLabel"></div>
    <button id="next" aria-label="다음 달">›</button>
  </div>

  <div class="card">
    <h2>기록하기</h2>
    <div class="datepick">
      <input type="date" id="date">
      <button class="today-btn" id="todayBtn">오늘</button>
      <span class="note" style="margin:0">값을 바꾸면 자동 저장됩니다</span>
    </div>
    <div class="grid">
      <div class="item">
        <div class="name">🏊 수영<small>오늘 했는지</small></div>
        <label class="toggle"><input type="checkbox" id="swim"><span></span></label>
      </div>
      <div class="item">
        <div class="name">🏃 달리기<small>거리</small></div>
        <div class="numin"><input type="number" id="run" min="0" step="1" inputmode="decimal" placeholder="0"><span class="unit">km</span></div>
      </div>
      <div class="item">
        <div class="name">💪 푸시업<small>횟수</small></div>
        <div class="numin"><input type="number" id="push" min="0" step="5" inputmode="numeric" placeholder="0"><span class="unit">개</span></div>
      </div>
      <div class="item">
        <div class="name">🧗 매달리기<small>오늘 했는지</small></div>
        <label class="toggle"><input type="checkbox" id="hang"><span></span></label>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>이번 달 요약</h2>
    <div class="stats">
      <div class="stat"><div class="k">수영</div><div class="v" id="sSwim">0<small>일</small></div></div>
      <div class="stat"><div class="k">매달리기</div><div class="v" id="sHang">0<small>일</small></div></div>
      <div class="stat"><div class="k">달리기 합계</div><div class="v" id="sRun">0<small>km</small></div></div>
      <div class="stat"><div class="k">푸시업 합계</div><div class="v" id="sPush">0<small>개</small></div></div>
    </div>
  </div>

  <div class="card">
    <h2>🏃 달리기 (km)</h2>
    <div class="chartbox" id="chartRun"></div>
  </div>

  <div class="card">
    <h2>💪 푸시업 (개)</h2>
    <div class="chartbox" id="chartPush"></div>
  </div>

  <div class="card">
    <h2>이번 달 한 날</h2>
    <div class="daysrow">
      <div class="head"><strong>🏊 수영</strong><span id="swimCount"></span></div>
      <div class="progress"><div id="swimBar" style="background:var(--swim)"></div></div>
      <div class="dots" id="swimDots"></div>
    </div>
    <div class="daysrow">
      <div class="head"><strong>🧗 매달리기</strong><span id="hangCount"></span></div>
      <div class="progress"><div id="hangBar" style="background:var(--hang)"></div></div>
      <div class="dots" id="hangDots"></div>
    </div>
  </div>

  <div class="card">
    <h2>📋 이번 달 기록 목록 <span class="note" id="listCount" style="margin:0"></span></h2>
    <div class="tablewrap" id="recList"></div>
    <div class="note">행을 누르면 해당 날짜로 이동해서 수정할 수 있습니다.</div>
  </div>

  <div class="card">
    <h2>데이터 백업</h2>
    <div class="tools">
      <button id="exportBtn">내보내기 (JSON)</button>
      <button id="importBtn">불러오기</button>
      <input type="file" id="importFile" accept="application/json" hidden>
    </div>
    <div class="note">기록은 이 브라우저에 저장됩니다. 브라우저 데이터를 지우면 사라지니 가끔 백업해 두세요.</div>
  </div>
</div>

<script>
(function(){
  var KEY = 'workout-checklist-v1';
  var data = {};
  try { data = JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e){ data = {}; }

  function save(){ try { localStorage.setItem(KEY, JSON.stringify(data)); } catch(e){} }
  function pad(n){ return n < 10 ? '0' + n : '' + n; }
  function ds(y, m, d){ return y + '-' + pad(m + 1) + '-' + pad(d); }
  function todayStr(){ var t = new Date(); return ds(t.getFullYear(), t.getMonth(), t.getDate()); }
  function parse(s){ var p = s.split('-'); return { y: +p[0], m: +p[1] - 1, d: +p[2] }; }
  function daysIn(y, m){ return new Date(y, m + 1, 0).getDate(); }

  var sel = todayStr();
  var view = { y: parse(sel).y, m: parse(sel).m };

  var $ = function(id){ return document.getElementById(id); };
  var elDate = $('date'), elSwim = $('swim'), elRun = $('run'), elPush = $('push'), elHang = $('hang');

  function loadForm(){
    var r = data[sel] || {};
    elDate.value = sel;
    elSwim.checked = !!r.swim;
    elHang.checked = !!r.hang;
    elRun.value = r.run ? r.run : '';
    elPush.value = r.push ? r.push : '';
  }

  function saveForm(){
    var r = {};
    if (elSwim.checked) r.swim = true;
    if (elHang.checked) r.hang = true;
    var run = parseFloat(elRun.value); if (run > 0) r.run = Math.round(run * 100) / 100;
    var push = parseInt(elPush.value, 10); if (push > 0) r.push = push;
    if (Object.keys(r).length) data[sel] = r; else delete data[sel];
    save();
    render();
  }

  function niceMax(v){
    if (v <= 0) return 4;
    var p = Math.pow(10, Math.floor(Math.log10(v)));
    var n = v / p;
    var m = n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10;
    return m * p;
  }

  function fmt(n){ return (Math.round(n * 10) / 10).toString(); }

  function drawBars(containerId, key, color, unit){
    var days = daysIn(view.y, view.m);
    var vals = [];
    for (var d = 1; d <= days; d++){
      var r = data[ds(view.y, view.m, d)];
      vals.push(r && r[key] ? r[key] : 0);
    }
    var max = niceMax(Math.max.apply(null, vals));
    var W = 700, H = 220, L = 38, R = 8, T = 14, B = 26;
    var cw = W - L - R, ch = H - T - B;
    var slot = cw / days, bw = Math.max(3, slot * 0.7);
    var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img">';
    s += '<g class="axis">';
    for (var i = 0; i <= 4; i++){
      var y = T + ch - (ch * i / 4);
      s += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y + '" y2="' + y + '"/>';
      s += '<text x="' + (L - 6) + '" y="' + (y + 4) + '" text-anchor="end">' + fmt(max * i / 4) + '</text>';
    }
    for (var d2 = 1; d2 <= days; d2++){
      if (d2 === 1 || d2 % 5 === 0){
        var x = L + slot * (d2 - 0.5);
        s += '<text x="' + x + '" y="' + (H - 8) + '" text-anchor="middle">' + d2 + '</text>';
      }
    }
    s += '</g>';
    for (var k = 0; k < days; k++){
      var v = vals[k];
      var bx = L + slot * k + (slot - bw) / 2;
      var date = ds(view.y, view.m, k + 1);
      var isSel = date === sel;
      var bh = v > 0 ? Math.max(2, ch * v / max) : 0;
      // clickable hit area
      s += '<g class="bar" data-date="' + date + '">';
      s += '<rect x="' + (L + slot * k) + '" y="' + T + '" width="' + slot + '" height="' + ch + '" fill="transparent"/>';
      if (bh > 0){
        s += '<rect x="' + bx + '" y="' + (T + ch - bh) + '" width="' + bw + '" height="' + bh + '" rx="2" fill="' + color + '"' +
             (isSel ? ' stroke="var(--sel)" stroke-width="2"' : '') + '/>';
      } else if (isSel){
        s += '<rect x="' + bx + '" y="' + (T + ch - 3) + '" width="' + bw + '" height="3" rx="1.5" fill="var(--sel)"/>';
      }
      s += '<title>' + (view.m + 1) + '월 ' + (k + 1) + '일: ' + fmt(v) + unit + '</title>';
      s += '</g>';
    }
    s += '</svg>';
    $(containerId).innerHTML = s;
  }

  function drawDots(containerId, key, color){
    var days = daysIn(view.y, view.m), count = 0, h = '';
    for (var d = 1; d <= days; d++){
      var date = ds(view.y, view.m, d);
      var on = !!(data[date] && data[date][key]);
      if (on) count++;
      h += '<div class="dot' + (on ? ' on' : '') + (date === sel ? ' sel' : '') + '" data-date="' + date + '"' +
           (on ? ' style="background:' + color + '"' : '') + '>' + d + '</div>';
    }
    $(containerId).innerHTML = h;
    return { count: count, days: days };
  }

  function drawList(){
    var days = daysIn(view.y, view.m), wk = ['일','월','화','수','목','금','토'];
    var rows = '', n = 0;
    for (var d = days; d >= 1; d--){
      var date = ds(view.y, view.m, d), r = data[date];
      if (!r) continue;
      n++;
      rows += '<tr class="rec' + (date === sel ? ' sel' : '') + '" data-date="' + date + '">' +
        '<td>' + (view.m + 1) + '/' + d + ' (' + wk[new Date(view.y, view.m, d).getDay()] + ')</td>' +
        '<td>' + (r.swim ? '<span class="chk">✓</span>' : '-') + '</td>' +
        '<td>' + (r.run ? fmt(r.run) + ' km' : '-') + '</td>' +
        '<td>' + (r.push ? r.push + ' 개' : '-') + '</td>' +
        '<td>' + (r.hang ? '<span class="chk">✓</span>' : '-') + '</td></tr>';
    }
    $('listCount').textContent = n ? '(' + n + '일)' : '';
    $('recList').innerHTML = n
      ? '<table class="rec"><thead><tr><th>날짜</th><th>수영</th><th>달리기</th><th>푸시업</th><th>매달리기</th></tr></thead><tbody>' + rows + '</tbody></table>'
      : '<div class="empty">이 달에는 아직 기록이 없습니다.</div>';
  }

  function render(){
    $('monthLabel').textContent = view.y + '년 ' + (view.m + 1) + '월';
    drawList();
    var days = daysIn(view.y, view.m), runSum = 0, pushSum = 0;
    for (var d = 1; d <= days; d++){
      var r = data[ds(view.y, view.m, d)];
      if (r){ runSum += r.run || 0; pushSum += r.push || 0; }
    }
    drawBars('chartRun', 'run', 'var(--run)', 'km');
    drawBars('chartPush', 'push', 'var(--push)', '개');
    var sw = drawDots('swimDots', 'swim', 'var(--swim)');
    var hg = drawDots('hangDots', 'hang', 'var(--hang)');
    $('swimCount').textContent = sw.count + '일 / ' + sw.days + '일';
    $('hangCount').textContent = hg.count + '일 / ' + hg.days + '일';
    $('swimBar').style.width = (sw.count / sw.days * 100) + '%';
    $('hangBar').style.width = (hg.count / hg.days * 100) + '%';
    $('sSwim').innerHTML = sw.count + '<small>일</small>';
    $('sHang').innerHTML = hg.count + '<small>일</small>';
    $('sRun').innerHTML = fmt(runSum) + '<small>km</small>';
    $('sPush').innerHTML = pushSum + '<small>개</small>';
  }

  function selectDate(s){
    sel = s;
    var p = parse(s);
    view = { y: p.y, m: p.m };
    loadForm();
    render();
  }

  function moveMonth(delta){
    var m = view.m + delta, y = view.y;
    if (m < 0){ m = 11; y--; }
    if (m > 11){ m = 0; y++; }
    view = { y: y, m: m };
    var t = parse(todayStr());
    var day = (t.y === y && t.m === m) ? t.d : 1;
    sel = ds(y, m, day);
    loadForm();
    render();
  }

  // events
  [elSwim, elHang].forEach(function(e){ e.addEventListener('change', saveForm); });
  [elRun, elPush].forEach(function(e){ e.addEventListener('input', saveForm); });
  elDate.addEventListener('change', function(){ if (elDate.value) selectDate(elDate.value); });
  $('todayBtn').addEventListener('click', function(){ selectDate(todayStr()); });
  $('prev').addEventListener('click', function(){ moveMonth(-1); });
  $('next').addEventListener('click', function(){ moveMonth(1); });

  document.addEventListener('click', function(ev){
    var t = ev.target.closest('[data-date]');
    if (t){
      selectDate(t.getAttribute('data-date'));
      if (t.classList.contains('rec')) window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  });

  $('exportBtn').addEventListener('click', function(){
    var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'workout-data-' + todayStr() + '.json';
    document.body.appendChild(a); a.click(); a.remove();
  });
  $('importBtn').addEventListener('click', function(){ $('importFile').click(); });
  $('importFile').addEventListener('change', function(ev){
    var f = ev.target.files[0]; if (!f) return;
    var rd = new FileReader();
    rd.onload = function(){
      try {
        var obj = JSON.parse(rd.result);
        if (obj && typeof obj === 'object'){
          if (confirm('현재 기록을 불러온 파일로 덮어쓸까요?')){
            data = obj; save(); loadForm(); render();
          }
        }
      } catch(e){ alert('올바른 JSON 파일이 아닙니다.'); }
      ev.target.value = '';
    };
    rd.readAsText(f);
  });

  loadForm();
  render();
})();
</script>
</body>
</html>
